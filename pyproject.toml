[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mealie-mcp"
version = "1.0.0"
description = "MCP server connecting ChatGPT to a self-hosted Mealie recipe manager, with HelloFresh UK import"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp==4.1.0",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "rapidfuzz==3.14.6",
    "PyJWT==2.15.1",
    "uvicorn==0.54.0",
    "anthropic==1.13.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "respx==0.23.1", "ruff==0.17.0"]

[project.scripts]
mealie-mcp = "mealie_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mealie_mcp = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
