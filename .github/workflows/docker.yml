name: CI / Docker

on:
  push:
    # Every branch is tested; only main and v* tags are published (see the publish job).
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: crashandburnds92/mealie-mcp

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -e .
      - name: Ruff
        run: ruff check src tests && ruff format --check src tests
      - name: Pytest
        run: pytest -q --junitxml=pytest.xml
      - name: Test summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, os
          if os.path.exists("pytest.xml"):
              root = ET.parse("pytest.xml").getroot()
              s = root if root.tag == "testsuite" else root.find("testsuite")
              print(f"### Tests: {s.get('tests')} run, {s.get('failures')} failed, {s.get('errors')} errors")
          else:
              print("### Tests did not run (dependency install or lint failed)")
          PY

  docker:
    name: Build & smoke-test image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64, local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mealie-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8000:8000 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e MEALIE_URL=https://mealie.invalid -e MEALIE_API_TOKEN=ci-dummy-token \
            -e PUBLIC_BASE_URL=http://localhost:8000 \
            -e OWNER_PASSWORD=ci-owner-password-123 -e AUTH_SECRET=$(openssl rand -hex 32) \
            mealie-mcp:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 1; done
          echo
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{}')
          test "$code" = "401" || { echo "::error::/mcp without a token returned $code, expected 401"; exit 1; }
          curl -fsS http://localhost:8000/.well-known/oauth-protected-resource/mcp | grep -q '"resource"'
          curl -fsS http://localhost:8000/.well-known/oauth-authorization-server | grep -q registration_endpoint
          test "$(docker exec smoke id -u)" != "0" || { echo "::error::container runs as root"; exit 1; }
          if docker logs smoke 2>&1 | grep -q ci-dummy-token; then echo "::error::token leaked to logs"; exit 1; fi
          echo "### Docker smoke test passed" >> "$GITHUB_STEP_SUMMARY"
      - name: Container logs on failure
        if: failure()
        run: docker logs smoke || true

  publish:
    name: Publish to Docker Hub
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error title=Docker Hub secrets missing::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN at Settings > Secrets and variables > Actions (see README)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Summary
        run: |
          {
            echo "### Published ${{ env.IMAGE }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
